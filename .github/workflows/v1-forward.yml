name: V1 forward

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, v1-forward]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install --requirement requirements.txt
      - name: Secret hygiene
        run: python tools/check_secret_hygiene.py
      - name: Test suites
        run: python -B -m unittest test_app test_catalog_store test_http_contract
      # The suites share a process and previously depended on which module
      # imported `app` first. Running a second order proves that stays fixed.
      - name: Test suites, reversed order
        run: python -B -m unittest test_http_contract test_catalog_store test_app

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v1-prototype/package-lock.json
      # `npm ci` and not `npm install`: it installs the lockfile exactly and
      # fails if package.json has drifted from it, which is the property that
      # makes the web build reproducible.
      - run: npm ci
        working-directory: v1-prototype
      # eslint is configured for no-undef above all: a build that succeeds
      # while a page cannot mount is what it catches.
      - name: Lint
        run: npm run lint
        working-directory: v1-prototype
      # Includes tests/design-system.test.mjs, which fails on a font size,
      # weight, line height, spacing, radius, colour or breakpoint that is not
      # one of the design system's. It reads the stylesheets as text, so it
      # needs no browser.
      - name: Unit and design-system tests
        run: npm test
        working-directory: v1-prototype
      - run: npm run build
        working-directory: v1-prototype

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, web]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: flipparr:ci
          build-args: FLIPPARR_BUILD=${{ github.sha }}
          provenance: false
      # Proves the artefact carries the commit that made it, rather than only
      # that it compiled.
      - name: Image is stamped with this commit
        run: |
          BUILD=$(docker run --rm --entrypoint printenv flipparr:ci FLIPPARR_BUILD)
          echo "image build stamp: $BUILD"
          test "$BUILD" = "${{ github.sha }}"
      # And that it starts and serves, which compiling does not prove.
      - name: Image starts and reports its version
        run: |
          docker run -d --name flipparr-ci -p 8787:8787 flipparr:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/healthz | tee /tmp/health.json
          grep -q '"build": "${{ github.sha }}"' /tmp/health.json
          docker rm -f flipparr-ci
