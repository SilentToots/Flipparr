name: flipparr

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  flipparr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Stamps the image with the commit it was built from, reported by
        # /healthz. Pass it as FLIPPARR_BUILD=$(git rev-parse HEAD); an
        # unstamped local build reports "source", which is fine for one.
        FLIPPARR_BUILD: "${FLIPPARR_BUILD:-source}"
    image: flipparr:local
    container_name: flipparr
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-10}"
    ports:
      # Loopback by default. Set FLIPPARR_BIND to publish elsewhere -- a LAN
      # address, or 0.0.0.0 on a network you trust. Turn on authentication in
      # setup before publishing anywhere other people can reach.
      #
      # Never bind to an address that appears after Docker starts: a Tailscale
      # or VPN interface address (100.x.y.z), especially one whose Tailscale
      # runs in a container. At boot Docker restores this container before that
      # address exists, the port bind fails, and a restart policy never retries
      # a container that failed to start -- it stays down until someone starts
      # it by hand. For tailnet access keep loopback and let Tailscale Serve
      # forward to it (see docs/OPERATING.md, HTTPS).
      - "${FLIPPARR_BIND:-127.0.0.1}:${FLIPPARR_PORT:-8787}:8787"
    environment:
      TZ: "${TZ:-America/New_York}"
      FLIPPARR_DATABASE: /config/flipparr.db
      FLIPPARR_PROVIDER_CONFIG: /config/metadata-providers.json
      FLIPPARR_ACQUISITION_CONFIG: /config/acquisition-services.json
      FLIPPARR_SETTINGS_CONFIG: /config/settings.json
      FLIPPARR_AUTH_CONFIG: /config/auth.json
      # Addresses whose X-Forwarded-For may be believed. Set this to the
      # reverse proxy's address when running behind one, otherwise the
      # "local addresses" auth bypass cannot see the real client.
      FLIPPARR_TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      FLIPPARR_WEB_ROOT: /app/web
      FLIPPARR_LIBRARY_ROOT: /comics
      FLIPPARR_SAB_COMPLETE_ROOT: /downloads/complete/comics
      FLIPPARR_IMPORT_POLL_SECONDS: "${IMPORT_POLL_SECONDS:-15}"
      FLIPPARR_MIN_FREE_SPACE_MB: "${MIN_FREE_SPACE_MB:-100}"
    volumes:
      - "${CONFIG_PATH:-./docker-data}:/config"
      - "${COMICS_PATH:?Set COMICS_PATH to the NAS comics directory}:/comics:rw"
      # Writable so a download is removed once its comic is verified in the
      # library: SABnzbd drops a finished job from its history but keeps its
      # files. Flipparr deletes only the one folder SABnzbd reported for that
      # job, never the category folder itself.
      - "${SAB_COMPLETE_PATH:?Set SAB_COMPLETE_PATH to SABnzbd's completed comics directory}:/downloads/complete/comics:rw"
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  proxy:
    name: home-services-proxy
    external: true
