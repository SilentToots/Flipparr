name: sonicboom

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sonicboom:
    build:
      context: .
      dockerfile: Dockerfile
    image: sonicboom:local
    container_name: sonicboom
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-10}"
    ports:
      - "127.0.0.1:${SONICBOOM_PORT:-8787}:8787"
    environment:
      TZ: "${TZ:-America/New_York}"
      COMICARR_DATABASE: /config/comicarr.db
      COMICARR_PROVIDER_CONFIG: /config/metadata-providers.json
      COMICARR_ACQUISITION_CONFIG: /config/acquisition-services.json
      COMICARR_SETTINGS_CONFIG: /config/settings.json
      COMICARR_AUTH_CONFIG: /config/auth.json
      # Addresses whose X-Forwarded-For may be believed. Set this to the
      # reverse proxy's address when running behind one, otherwise the
      # "local addresses" auth bypass cannot see the real client.
      COMICARR_TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      COMICARR_WEB_ROOT: /app/web
      COMICARR_LIBRARY_ROOT: /comics
      COMICARR_SAB_COMPLETE_ROOT: /downloads/complete/comics
      COMICARR_IMPORT_POLL_SECONDS: "${IMPORT_POLL_SECONDS:-15}"
      COMICARR_MIN_FREE_SPACE_MB: "${MIN_FREE_SPACE_MB:-100}"
    volumes:
      - "${CONFIG_PATH:-./docker-data}:/config"
      - "${COMICS_PATH:?Set COMICS_PATH to the NAS comics directory}:/comics:rw"
      - "${SAB_COMPLETE_PATH:?Set SAB_COMPLETE_PATH to SABnzbd's completed comics directory}:/downloads/complete/comics:ro"
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  proxy:
    name: home-services-proxy
    external: true
