name: flipparr

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  flipparr:
    # The published image, at the release this file shipped with. To follow
    # a different tag, or an image you built yourself (compose.build.yaml),
    # set FLIPPARR_IMAGE in .env. Rolling back is setting it to the previous
    # tag -- with the config folder restored from the backup taken before
    # the upgrade, if the schema moved (docs/OPERATING.md, section 4).
    image: "${FLIPPARR_IMAGE:-ghcr.io/silenttoots/flipparr:0.1.0}"
    container_name: flipparr
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # Loopback by default. Set FLIPPARR_BIND to publish elsewhere -- a LAN
      # address, or 0.0.0.0 on a network you trust. Turn on authentication in
      # setup before publishing anywhere other people can reach.
      #
      # Never bind to an address that appears after Docker starts: a Tailscale
      # or VPN interface address (100.x.y.z), especially one whose Tailscale
      # runs in a container. At boot Docker restores this container before that
      # address exists, the port bind fails, and a restart policy never retries
      # a container that failed to start -- it stays down until someone starts
      # it by hand. For tailnet access keep loopback and let Tailscale Serve
      # forward to it (see docs/OPERATING.md, HTTPS).
      - "${FLIPPARR_BIND:-127.0.0.1}:${FLIPPARR_PORT:-8787}:8787"
    environment:
      TZ: "${TZ:-UTC}"
      FLIPPARR_DATABASE: /config/flipparr.db
      FLIPPARR_PROVIDER_CONFIG: /config/metadata-providers.json
      FLIPPARR_ACQUISITION_CONFIG: /config/acquisition-services.json
      FLIPPARR_SETTINGS_CONFIG: /config/settings.json
      FLIPPARR_AUTH_CONFIG: /config/auth.json
      # Addresses or networks (CIDR) whose X-Forwarded-For may be believed. Set
      # this to the reverse proxy's Docker network subnet when running behind
      # one -- not its container address, which changes across restarts --
      # otherwise the "local addresses" auth bypass cannot see the real client.
      FLIPPARR_TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      # Names this server may be opened by while sign-in is off or the local
      # bypass is on, besides addresses and local names (.env.example).
      FLIPPARR_ALLOWED_HOSTS: "${FLIPPARR_ALLOWED_HOSTS:-}"
      FLIPPARR_WEB_ROOT: /app/web
      FLIPPARR_LIBRARY_ROOT: /comics
      FLIPPARR_SAB_COMPLETE_ROOT: /downloads/complete/comics
      FLIPPARR_TORRENT_COMPLETE_ROOT: /downloads/torrents/complete/comics
      FLIPPARR_IMPORT_POLL_SECONDS: "${IMPORT_POLL_SECONDS:-15}"
      FLIPPARR_MIN_FREE_SPACE_MB: "${MIN_FREE_SPACE_MB:-100}"
    volumes:
      - "${CONFIG_PATH:-./docker-data}:/config"
      - "${COMICS_PATH:?Set COMICS_PATH to the NAS comics directory}:/comics:rw"
      # Writable so a download is removed once its comic is verified in the
      # library: SABnzbd drops a finished job from its history but keeps its
      # files. Flipparr deletes only the one folder SABnzbd reported for that
      # job, never the category folder itself.
      - "${SAB_COMPLETE_PATH:?Set SAB_COMPLETE_PATH to SABnzbd's completed comics directory}:/downloads/complete/comics:rw"
      # Read-only: a torrent keeps seeding from here after its comic is copied
      # into the library, and only qBittorrent removes anything -- when its
      # own ratio or time limit stops the torrent. Optional; without
      # qBittorrent it is an empty folder.
      - "${TORRENT_COMPLETE_PATH:-./docker-data/torrents-complete}:/downloads/torrents/complete/comics:ro"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    # A comic library needs no capability at all, and a bound on memory and
    # processes keeps a runaway render or a malicious archive from taking
    # the host with it. Raise FLIPPARR_MEMORY_LIMIT for a library of many
    # thousands of comics (the catalog is held in memory).
    cap_drop: [ALL]
    mem_limit: "${FLIPPARR_MEMORY_LIMIT:-3g}"
    pids_limit: 512
    logging: *default-logging

# To put Flipparr on a network your reverse proxy or download clients share,
# add a compose.override.yaml beside this file (docs/OPERATING.md, "Behind a
# reverse proxy"); nothing here assumes one.
