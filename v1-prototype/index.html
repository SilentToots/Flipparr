<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#09090b" />
    <!-- One mark, black and white, for every place a device shows it. The SVG
         flips with the tab strip's theme; the PNGs are a white mark on a black
         tile for browsers, home screens and launchers that take no SVG. -->
    <link rel="icon" type="image/svg+xml" href="/brand/flipparr-favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />
    <link rel="mask-icon" href="/brand/flipparr-mark-monochrome.svg" color="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Flipparr" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Flipparr</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
